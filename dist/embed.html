.al-sound { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.al-sound:hover { border-color: var(--accent); }
.al-sound .al-kicker { display: block; }
.al-sound strong { display: block; font-size: var(--text-md, 1rem); }
.al-sound > svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.al-sound-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 1.1rem; flex: none; }
.snd-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.snd-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); }
.snd-row.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.snd-play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: .95rem; cursor: pointer; flex: none; }
.snd-play:active { transform: scale(.92); }
.snd-pick { border: 0; background: none; font: inherit; color: var(--ink); text-align: left; padding: 6px 0; cursor: pointer; min-width: 0; }
.snd-pick strong { display: block; }
.snd-pick small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.snd-check { width: 22px; color: var(--accent); flex: none; }
.snd-check svg { width: 20px; height: 20px; }

/* ---------- Accessibility: text colours that meet WCAG AA (4.5:1) in both themes ---------- */
:root { --warm-text: #a3540f; --gold-text: #8a5a10; --oc-share: 45%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --warm-text: #f0a35a; --gold-text: #f2c14e; --oc-share: 80%; } }
:root[data-theme='dark'] { --warm-text: #f0a35a; --gold-text: #f2c14e; --oc-share: 80%; }
.xp-chip .flame, .pill-stat.streak, .lrow .trail .tag.warm, .tag.warm { color: var(--warm-text); }
.pill-stat.xp, .celebrate-modal .kicker, .xp-float.lucky { color: var(--gold-text); }
/* Body-part colours are bright fills; as text they're mixed toward the ink colour for contrast. */
.bt-lvl, .body-medal em { color: color-mix(in srgb, var(--oc) var(--oc-share), var(--ink)); }
.week-strip span.first { color: var(--accent-ink); }
.next-up .eyebrow, .body > .eyebrow { color: #e3efe9; }
.quest.done .qp, .stats .stat.on .l { color: var(--ink-2); }
.qchip .num { color: var(--ink-2); }
/* "Off" settings stay readable: dimmed by colour, not by fading text below contrast. */
form:has(input[name=enabled]:not(:checked)) .reminder-list { opacity: 1; filter: saturate(0.2); }
.learn-card .learn-title { font-size: var(--text-lg); margin: 6px 0; }
h2.h3 { font-size: var(--text-lg); }

/* ---------- Today: three day rings, quick log, one timeline ---------- */
:root { --ring-eat: #f0475f; --ring-move: #22b36b; --ring-habits: #2f8fe8; --ring-eat-text: #b81f3a; --ring-move-text: #146b42; --ring-habits-text: #1a5fa8; }
:root[data-theme='dark'] { --ring-eat: #ff5f78; --ring-move: #3ddc8a; --ring-habits: #52b0ff; --ring-eat-text: #ff8597; --ring-move-text: #5fe39f; --ring-habits-text: #7cc3ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --ring-eat: #ff5f78; --ring-move: #3ddc8a; --ring-habits: #52b0ff; --ring-eat-text: #ff8597; --ring-move-text: #5fe39f; --ring-habits-text: #7cc3ff; } }
.rings-hero .hero-top { gap: 18px; }
.rings-wrap { position: relative; flex: none; width: 132px; height: 132px; display: block; text-decoration: none; color: var(--ink); }
.day-rings-svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.day-rings-svg circle { fill: none; stroke-width: 13; }
.day-rings-svg .rb { stroke-opacity: 0.16; }
.day-rings-svg .rf { stroke-linecap: round; transition: stroke-dashoffset 900ms var(--ease-out); animation: ring-in 900ms var(--ease-out) both; }
.day-rings-svg .rf.empty { stroke-opacity: 0; }
@keyframes ring-in { from { stroke-dashoffset: 1000; } }
.rings-center { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.rings-center small { font-size: 0.85rem; color: var(--ink-3); font-weight: 700; }
.rings-center { grid-auto-flow: column; justify-content: center; align-items: baseline; align-content: center; }
.hero-sub { margin: 0 0 8px; font-size: var(--text-sm); color: var(--ink-3); }
.ring-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.ring-leg { display: flex; align-items: center; gap: 7px; font-size: var(--text-sm); min-width: 0; }
.ring-leg .rdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ring-leg .rl { font-weight: 750; width: 50px; flex: none; }
.ring-leg .rv { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ring-leg.closed .rv { color: var(--ink); font-weight: 650; }
.rings-hero .hero-pills { margin-top: 14px; }
.rings-hero.perfect { background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--ring-eat) 18%, var(--surface)) 0%, color-mix(in srgb, var(--ring-move) 14%, var(--surface)) 45%, color-mix(in srgb, var(--ring-habits) 16%, var(--surface)) 100%); }
.rings-hero.perfect .day-rings-svg { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--ring-move) 45%, transparent)); }
@media (max-width: 360px) { .rings-wrap { width: 108px; height: 108px; } .rings-hero .hero-top { gap: 12px; } .ring-leg .rl { width: 44px; } }

.quick-log { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 8px; margin: 0 0 14px; }
.ql-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font: inherit; font-size: var(--text-sm); font-weight: 650; text-decoration: none; cursor: pointer; min-height: 44px; }
.ql-btn:active { transform: scale(0.96); }
.ql-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }

.day-count { font-size: var(--text-sm); color: var(--ink-3); font-weight: 650; font-variant-numeric: tabular-nums; }
.timeline-list .tl-part { padding: 14px 16px 6px; font-size: var(--text-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); border-top: 1px solid var(--line); background: var(--surface-2); }
.timeline-list > li:first-child.tl-part, .timeline-list > .kcal-sum + li { border-top: 0; }
.timeline-list .tl-part + li > .lrow { border-top: 0; }
.timeline-list .tl-now { position: relative; height: 22px; margin: 0 16px; display: flex; align-items: center; }
.timeline-list .tl-now::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--ring-eat); border-radius: 2px; }
.timeline-list .tl-now span { position: relative; background: var(--ring-eat); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.timeline-list .tl-now + li > .lrow, .timeline-list .tl-now + .tl-part { border-top: 0; }
.timeline-list .k-meal .lrow .over { color: var(--ring-eat-text); }
.timeline-list .k-habit .lrow .over { color: var(--ring-habits-text); }
.timeline-list .k-move .lrow .over, .timeline-list .k-weigh .lrow .over { color: var(--ring-move-text); }
.timeline-list .k-meal .check.on { background: var(--ring-eat); border-color: var(--ring-eat); color: #fff; }
.timeline-list .k-habit .check.on { background: var(--ring-habits); border-color: var(--ring-habits); color: #fff; }
.day-links { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: var(--text-sm); font-weight: 650; }
.day-links a { text-decoration: none; }

.ring-banner { position: fixed; z-index: 90; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 750; box-shadow: 0 10px 30px rgba(0,0,0,.18); border: 2px solid var(--rc); animation: rb-in 2.6s var(--ease-out) both; pointer-events: none; white-space: nowrap; }
.ring-banner .rb-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--rc); }
@keyframes rb-in { 0% { opacity: 0; transform: translate(-50%, -24px) scale(.9); } 12%, 82% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
@media (prefers-reduced-motion: reduce) { .ring-banner { animation: none; } }

.welcome-back { border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--ring-move) 16%, var(--surface)), color-mix(in srgb, var(--ring-habits) 12%, var(--surface))); border: 1px solid color-mix(in srgb, var(--ring-move) 30%, transparent); }
.welcome-back .wb-emoji { font-size: 2rem; line-height: 1; }
.welcome-back h2 { margin: 6px 0 4px; font-size: var(--text-xl); }
.welcome-back p { margin: 0 0 12px; color: var(--ink-2); font-size: var(--text-sm); line-height: 1.5; }

.reason-lib { scroll-margin-top: 84px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.reason-lib summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 6px; }
.reason-search { width: 100%; margin-top: 8px; }
.reason-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 420px; overflow-y: auto; padding: 2px; }
.reason-btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; min-height: 40px; font: inherit; font-size: var(--text-sm); font-weight: 600; cursor: pointer; text-align: left; }
.reason-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.page-head:has(.day-nav) { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.day-nav { display: flex; align-items: center; gap: 2px; flex: none; }
.day-nav > .icon-btn:first-child .icon { transform: rotate(180deg); }
.day-nav .icon-btn[aria-disabled="true"] { opacity: .3; pointer-events: none; }
.day-nav-label { font-size: var(--text-sm); font-weight: 700; color: var(--ink-2); min-width: 64px; text-align: center; }

/* ---------- Food picker ---------- */
.food-results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow-y: auto; }
.food-results:empty { display: none; }
.food-hit { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; font: inherit; color: var(--ink); cursor: pointer; min-height: 48px; }
.food-hit small, .food-item small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.food-plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.food-plus .icon { width: 16px; height: 16px; }
.food-none { padding: 10px 4px; font-size: var(--text-sm); }
.food-picked { margin-top: 10px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.food-picked ul { list-style: none; margin: 4px 0 0; padding: 0; }
.food-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.food-item .stepper { display: flex; align-items: center; gap: 6px; }
.food-item .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; }
.food-item .stepper span { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.food-total { margin-top: 6px; font-size: var(--text-sm); color: var(--ink-2); }
.food-sides { margin-top: 10px; }
.food-sides summary, .food-manual summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); }
.side-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.side-chip { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 12px; min-height: 38px; font: inherit; font-size: var(--text-sm); font-weight: 600; cursor: pointer; }
.side-chip small { color: var(--ink-3); font-weight: 600; }
.side-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.side-chip.on small { color: inherit; opacity: .8; }
.food-manual { margin-top: 8px; }

/* ---------- Re-plan + activity log ---------- */
button.pill { font: inherit; border: 0; cursor: pointer; }
.pill.moved { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
.move-days { display: grid; gap: 8px; }
.move-day { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 52px; }
.move-day small { color: var(--ink-3); font-size: var(--text-xs); }
.move-day.on { border-color: var(--accent); background: var(--accent-soft); }
.intensity-opts { display: grid; gap: 8px; }
.int-opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 14px; cursor: pointer; }
.int-opt small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.int-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Calendar ---------- */
.cal { display: grid; gap: 10px; }
.cal-day { display: grid; grid-template-columns: 52px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 12px; }
.cal-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cal-date { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4px; }
.cal-date b { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.cal-date span { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cal-ev, .cal-plan, .cal-add { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface-2); border: 0; border-radius: 12px; padding: 8px 10px; cursor: pointer; min-height: 44px; }
.cal-plan { background: transparent; border: 1px dashed var(--line-strong); }
.cal-ev small, .cal-plan small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.cal-add { background: transparent; color: var(--accent); font-weight: 650; font-size: var(--text-sm); min-height: 36px; }
.cal-add .icon { width: 16px; height: 16px; }
.cal-emoji { font-size: 1.25rem; line-height: 1; flex: none; }
.cal-emoji.big { font-size: 1.8rem; }
.cal-public { gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 14px; cursor: pointer; }
.cal-public small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.cal-public input { margin-top: 4px; }
.share-link { display: flex; gap: 6px; }
.share-link input { flex: 1; min-width: 0; font-size: var(--text-sm); }
/* ---------- Join page (friends) ---------- */
.join-page { max-width: 560px; margin: 0 auto; padding: 28px 4px 40px; }
.join-page h1 { margin: 4px 0 8px; }
.join-intro { color: var(--ink-2); margin: 0 0 18px; }
.join-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.join-ev { margin: 0; }
.cal-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.cal-link small { display: block; color: var(--ink-3); font-size: var(--text-sm); }

/* ---------- Plan tomorrow ---------- */
.plan-card { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); background: linear-gradient(135deg, color-mix(in srgb, var(--ring-habits) 14%, var(--surface)), var(--surface)); }
.plan-card small { display: block; color: var(--ink-3); font-size: var(--text-sm); }
.plan-list { list-style: none; margin: 0; padding: 0; }
.plan-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.plan-row:first-child { border-top: 0; }
.plan-row small { display: block; color: var(--ink-3); font-size: var(--text-xs); }
.plan-row .meal-time { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 44px; padding-top: 2px; }
.plan-when { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.plan-when input[type=time] { width: auto; min-width: 104px; }
.plan-when input[type=text] { flex: 1; min-width: 120px; }
.plan-set { color: var(--accent) !important; font-weight: 650; margin-top: 4px; }
.cal-back .icon { transform: rotate(180deg); }

/* ---------- Cheers + join page polish ---------- */
.cheer-card { background: linear-gradient(135deg, color-mix(in srgb, var(--ring-eat) 12%, var(--surface)), var(--surface)); }
.cheer-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; font-size: var(--text-sm); }
.cheer-list li { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.join-hero { text-align: left; margin-bottom: 18px; }
.join-wave { font-size: 2.4rem; line-height: 1; }
.join-hero h1 { margin: 8px 0 8px; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; }
.join-promises { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: var(--text-sm); color: var(--ink-2); }
.join-promises li { display: flex; align-items: center; gap: 8px; }
.join-promises .icon { width: 16px; height: 16px; color: var(--accent); }
.join-h { font-size: var(--text-lg); margin: 6px 0 10px; }
.join-cheer { margin-top: 18px; }
.join-cheer h2 { font-size: var(--text-lg); margin: 0 0 6px; }
.join-cheer input, .join-cheer textarea { width: 100%; }
.join-foot { font-size: var(--text-xs); margin-top: 24px; }

.suggest-wrap { position: relative; display: block; }
.suggest-wrap input { width: 100%; }
.hobby-suggest { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; margin-top: 4px; overflow: hidden; box-shadow: var(--shadow); }
.hobby-suggest:empty { display: none; }
.hobby-suggest button { text-align: left; background: var(--surface); color: var(--ink); border: 0; border-top: 1px solid var(--line); padding: 10px 12px; min-height: 44px; font: inherit; font-size: var(--text-sm); cursor: pointer; }
.hobby-suggest button:first-child { border-top: 0; }

/* ---------- Craving SOS ---------- */
.ql-sos .ql-ico { background: color-mix(in srgb, var(--ring-habits) 16%, transparent); font-size: 1.1rem; }
.sos-page { max-width: 560px; margin: 0 auto; }
.sos-hero { text-align: center; padding: 6px 0 10px; }
.sos-wave { font-size: 2.6rem; text-align: center; }
.sos-hero h1, .sos-page h1 { margin: 6px 0 8px; text-align: center; }
.sos-kicker { margin: 6px 0 2px; font-size: var(--text-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sos-why { margin: 0 0 10px; font-size: var(--text-lg); font-weight: 650; line-height: 1.35; text-align: center; }
.sos-tools { display: grid; gap: 8px; margin-top: 8px; }
.sos-tool { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 64px; }
.sos-tool small { display: block; color: var(--ink-3); font-size: var(--text-xs); margin-top: 2px; }
.sos-emoji { font-size: 1.6rem; flex: none; }
.sos-run { text-align: center; padding-top: 8px; }
.sos-timer { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
.sos-step { font-size: var(--text-lg); font-weight: 600; line-height: 1.4; min-height: 3em; }
.sos-step.big { font-size: 1.3rem; }
.sos-eyes { font-size: 4rem; margin: 10px 0; }
.sos-breath { width: 180px; height: 180px; margin: 10px auto 16px; display: grid; place-items: center; }
.sos-breath span { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--ring-habits) 55%, transparent), color-mix(in srgb, var(--ring-habits) 15%, transparent)); transform: scale(1); transition: transform 4s ease-in-out; }
.sos-breath.out span { transform: scale(.55); transition-duration: 6s; }
.sos-puzzle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(300px, 86vw); margin: 0 auto 10px; }
.sos-tile { aspect-ratio: 1; border-radius: 14px; border: 0; font: inherit; font-size: 1.8rem; font-weight: 800; color: #fff; cursor: pointer; }
.sos-tile.blank { background: var(--surface-2); }
.sos-tile.t1, .sos-tile.t5 { background: var(--ring-eat); }
.sos-tile.t2, .sos-tile.t6 { background: var(--ring-move); }
.sos-tile.t3, .sos-tile.t7 { background: var(--ring-habits); }
.sos-tile.t4, .sos-tile.t8 { background: color-mix(in srgb, var(--accent) 80%, #000); }
.sos-after { display: grid; gap: 10px; margin-top: 14px; }
@media (prefers-reduced-motion: reduce) { .sos-breath span { transition: none; } }

/* ---------- Calendar views (Day / 3 days / Week / Month / Schedule) ---------- */
.cal-views { display: flex; width: 100%; margin: 4px 0 8px; }
.cal-views button { flex: 1; font-size: var(--text-sm); padding-left: 4px; padding-right: 4px; }
.cal-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-nav strong { font-size: var(--text-base); }
.cal-nav .cal-back .icon { transform: rotate(180deg); }
.cal-chip { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 3px 6px; margin: 0 0 3px; font: inherit; font-size: 11px; line-height: 1.3; font-weight: 650; color: #fff; background: var(--accent); cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-height: 22px; }
.cal-chip.plan { background: transparent; color: var(--ink-2); border: 1px dashed var(--line-strong); }
.k-walk { --k: #2f9e6e; } .k-workout { --k: #d0573f; } .k-sport { --k: #2f7fd0; } .k-outdoors { --k: #7a8a2a; }
.k-cooking { --k: #c47a12; } .k-shopping { --k: #8a5ac8; } .k-habit { --k: #2f8f9e; } .k-other { --k: #5f6b66; }
.cal-chip[class*="k-"], .cg-ev { background: var(--k, var(--accent)); }
[data-drag] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.cg { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.cg-head, .cg-allday { display: grid; grid-template-columns: 44px repeat(var(--cols), minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.cg-gutter { font-size: 10px; color: var(--ink-3); padding: 4px 2px; text-align: right; }
.cg-dayhead { background: none; border: 0; border-left: 1px solid var(--line); padding: 6px 2px; font: inherit; color: var(--ink-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.cg-dayhead span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.cg-dayhead b { font-size: 1.15rem; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.cg-dayhead.today b { background: var(--accent); color: var(--accent-ink); }
.cg-adcell { border-left: 1px solid var(--line); padding: 3px; min-height: 30px; }
.cg-scroll { max-height: 62vh; overflow-y: auto; position: relative; }
.cg-body { display: grid; grid-template-columns: 44px repeat(var(--cols), minmax(0, 1fr)); position: relative; }
.cg-hours { position: relative; }
.cg-hours span { position: absolute; right: 4px; font-size: 10px; color: var(--ink-3); transform: translateY(-6px); }
.cg-hours span:first-child { transform: none; }
.cg-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 48px); cursor: cell; }
.cg-col.today { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }
.cg-ev { position: absolute; border: 0; border-radius: 8px; padding: 3px 5px; text-align: left; color: #fff; font: inherit; font-size: 11px; line-height: 1.25; overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.cg-ev b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg-ev small { display: block; opacity: .9; }
.cg-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--ring-eat); z-index: 2; pointer-events: none; }
.cg-now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--ring-eat); }
.cm { border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
.cm-head { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; color: var(--ink-3); text-align: center; padding: 6px 0; border-bottom: 1px solid var(--line); text-transform: uppercase; }
.cm-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cm-cell { min-height: 84px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 2px; overflow: hidden; }
.cm-cell:nth-child(7n + 1) { border-left: 0; }
.cm-cell.other { background: var(--surface-2); }
.cm-cell.other .cm-date { color: var(--ink-3); }
.cm-date { background: none; border: 0; font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; margin: 1px auto 2px; }
.cm-cell.today .cm-date { background: var(--accent); color: var(--accent-ink); }
.cm-cell .cal-chip { font-size: 10px; padding: 2px 4px; min-height: 18px; }
.cm-more { background: none; border: 0; font: inherit; font-size: 10px; font-weight: 700; color: var(--ink-3); cursor: pointer; padding: 0 4px; }
.cal-ghost { opacity: .92; box-shadow: 0 10px 28px rgba(0,0,0,.3); transform: scale(1.04) rotate(-1deg); }
.cal-ghost[data-time]:not([data-time=""])::after { content: attr(data-time); position: absolute; right: 6px; top: -22px; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
.cal-dragging-src { opacity: .35; }
.cal-drop-over { outline: 2px solid var(--accent); outline-offset: -2px; background-color: color-mix(in srgb, var(--accent) 10%, transparent) !important; }
body.cal-dragging { cursor: grabbing; }

  [/dance|zumba/i, 'dancing'],

}

/** What a search looks through for an activity: its name, everyday words for it, and its group. */
const hobbySearchText = (h) => plain(`${h.name} ${h.tags || ''} ${HOBBY_CATEGORIES[h.cat] || ''}`);
/** Every word must appear somewhere ("cardio hard", "bike indoor"). */
const matchesWords = (text, q) => plain(q).trim().split(/\s+/).filter(Boolean).every((w) => text.includes(w));

/** Activities matching a search, names that start with it first, then names containing it, then the rest. */
function searchHobbies(q, limit = 8) {
  const first = plain(q).trim().split(/\s+/)[0] || '';
  if (first.length < 2) return [];
  const rank = (h) => {
    const n = plain(h.name);
    if (n === plain(q).trim()) return -1;

    return n.startsWith(first) ? 0 : n.includes(first) ? 1 : (h.words || '').includes(first) ? (h.cat === 'fitness' ? 2 : 2.5) : 3;

  return HOBBIES.map((h, i) => [rank(h), i, h]).filter((x) => matchesWords(hobbySearchText(x[2]), q)).sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, limit).map((x) => x[2]);
}

/** Compendium intensity band → the app's intensity levels. */
function intensityFromMet(met) {
  return met >= 6 ? 'vigorous' : met >= 3 ? 'moderate' : 'easy';
}

function hobbyByName(name) {
  const n = String(name || '').trim().toLowerCase();
  return HOBBIES.find((h) => h.name.toLowerCase() === n) || null;
}

    : `<span class="eyebrow">${icon('flag')} Next stop · ${esc(whenLabel(next, date))}</span><strong>${esc(next.title)}${!hide && next.kind !== 'time' ? ` — ${fmtKg(Math.max(0, j.now - next.weightKg), u)} to go` : ''}</strong>${!hide && j.goalKg ? `<span class="bar" style="margin-top:8px"><span style="width:${Math.max(1.5, j.pct).toFixed(1)}%"></span></span><span class="sub">${fmtKg(j.lost, u)} down · ${j.pct.toFixed(0)}% of the way to ${fmtKg(j.goalKg, u)}</span>` : ''}${next !== n.time && n.time && n.time.date < (next.date || '9999') ? `<span class="sub">Before that: <strong style="font-size:inherit;color:var(--ink-2)">${esc(n.time.title)}</strong> · ${esc(whenLabel(n.time, date).split(' · ')[1] || '')}</span>` : ''}`;
  return `<a class="card journey-next" href="#/journey">${body}<span class="more">Your journey ${icon('chevron')}</span></a>`;
}

const SLOT_HOUR = { breakfast: 7, snack: 10, lunch: 12, snack2: 15, dinner: 18, snack3: 20 };

/** Evening: a nudge to plan tomorrow (until it's done). */
function planCard(state) {
  if (new Date().getHours() < 18 || isPlanned(state)) return '';
  return `<a class="card plan-card" href="#/plan"><span class="cal-emoji big" aria-hidden="true">🌙</span><span class="grow"><strong>Plan tomorrow</strong><small>Two minutes: when and where you’ll move, and a look at tomorrow’s meals</small></span>${icon('chevron')}</a>`;
}

function dayLabel(date, today) {
  if (date === addDays(today, -1)) return 'Yesterday';
  return fmtDate(date, { weekday: 'long', day: 'numeric', month: 'short' });
}

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

// ---------- Hero: today's three rings + XP + streak ----------
function hero(state, date) {
  const g = store.game(state);
  const r = dayRings(state, date);
  const closed = Object.values(r).filter((x) => x.closed).length;
  const title = closed === 3 ? 'All rings closed!' : closed === 0 ? 'Close your three rings' : `${3 - closed} ring${3 - closed > 1 ? 's' : ''} to go`;
  const sub = closed === 3 ? 'A perfect day. This is what consistency looks like.' : 'Tick things off as your day happens.';
  const leg = Object.entries(r).map(([k, x]) => `<li class="ring-leg ${x.closed ? 'closed' : ''}"><span class="rdot" style="background:${RING_META[k].color}"></span><span class="rl">${RING_META[k].label}</span><span class="rv">${x.closed ? '✓ ' : ''}${esc(x.text)}</span></li>`).join('');
  return `<section class="hero-today rings-hero ${closed === 3 ? 'perfect' : ''}" aria-label="Today's rings: ${Object.entries(r).map(([k, x]) => `${RING_META[k].label} ${Math.round(x.pct * 100)}%`).join(', ')}">
    <div class="hero-top">
      <a class="rings-wrap" href="#/rewards" aria-label="Rewards and quests">${ringsSvg(r)}<span class="rings-center">${closed}<small>/3</small></span></a>
      <div class="hero-meta"><h2>${title}</h2><p class="hero-sub">${sub}</p><ul class="ring-legend">${leg}</ul></div>
    </div>
    <div class="hero-pills">
      <a class="pill-stat streak" href="#/rewards">${icon('flame')}${g.streak}-day streak</a>
      <a class="pill-stat xp" href="#/rewards">${icon('star')}${g.todayXp} XP today</a>
      <a class="pill-stat" href="#/rewards">Level ${g.level}</a>
    </div>
  </section>`;
}

// ---------- Quick log: the four things people log most, one tap away ----------
function quickLog(state) {
  const hide = store.habitsOnly(state);
  const b = (action, ic, label, extra = '') => `<button class="ql-btn" data-action="${action}" ${extra}><span class="ql-ico">${icon(ic)}</span>${label}</button>`;
  return `<div class="quick-log" role="group" aria-label="Quick log">
    ${b('openExtra', 'plus', 'Food')}
    ${hide ? '' : b('openWeigh', 'scale', 'Weight')}
    <a class="ql-btn" href="#/move"><span class="ql-ico">${icon('move')}</span>Workout</a>
    <a class="ql-btn ql-sos" href="#/sos"><span class="ql-ico" aria-hidden="true">🌊</span>Craving</a>
  </div>`;
}

// ---------- Next up: the single most useful thing to do now ----------
function nextUp(state, date) {
  const h = new Date().getHours();
  const hide = store.habitsOnly(state);
  const log = state.mealLog[date] || {};
  const meals = mealsFor(state, date);
  const card = (eyebrow, t, s, btn, done = false) => `<section class="next-card ${done ? 'done' : ''}" aria-label="Next up"><div class="body"><div class="eyebrow">${eyebrow}</div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div>${btn || ''}</section>`;
  const btn = (label, attrs) => `<button class="btn small" ${attrs}>${label}</button>`;
  if (!hide && h < 12 && !state.weights.some((w) => w.date === date)) return card('Next up', 'Weigh in', 'Ten seconds · +5 XP', btn('Log', 'data-action="openWeigh"'));
  const nowMin = h * 60 + new Date().getMinutes();
  const due = meals.find((m) => !log[m.slot] && m.time <= nowMin + 30);
  if (due) return card(`Next up · ${toHHMM(due.time)} ${slotLabel(due.slot)}`, esc(byId(due.recipeId).name), 'Log it, whatever you ate · +10 XP', btn('Log', `data-action="openMeal" data-slot="${due.slot}" data-date="${date}"`));
  const { schedule } = store.schedule(state, date);
  const items = schedule[(new Date(date + 'T12:00').getDay() + 6) % 7].items;
  const move = items.find((it) => it.kind !== 'rest' && !itemDone(state.workouts.log[date] || [], it));
  if (move && h >= 7) {
    if (move.kind === 'strength') return card('Next up · Movement', `Strength session ${move.variant}`, `About ${move.minutes} min · +40 XP`, `<a class="btn small" href="#/move/session/${move.variant}">Start</a>`);
    if (move.kind === 'activity') return card('Next up · Movement', esc(move.name), `${move.minutes} min · tap Done afterwards`, btn('Done', `data-action="activityDone" data-id="${esc(move.id)}"`));
    return card('Next up · Movement', `${move.minutes} min ${esc(CARDIO[move.mode].label.toLowerCase())}`, 'At a pace where you can talk', btn('Done', `data-action="cardioDone" data-mode="${move.mode}" data-min="${move.minutes}"`));
  }
  const habit = store.visibleHabits(state).find((a) => !state.habits.log[date]?.[a.id]);
  if (habit) return card('Next up · Habit', esc(habitById(habit.id).title), esc(habit.cue), btn('Open', `data-action="openHabit" data-id="${habit.id}"`));
  if (checkinDue(state, date)) return card('Next up', 'Weekly check-in', 'Two minutes · +50 XP', `<a class="btn small" href="#/checkin">Start</a>`);
  const later = meals.find((m) => !log[m.slot]);
  if (later) return card(`Later · ${toHHMM(later.time)} ${slotLabel(later.slot)}`, esc(byId(later.recipeId).name), 'Tap to see the recipe', btn('View', `data-action="openMeal" data-slot="${later.slot}" data-date="${date}"`));
  return card('All done', 'Everything’s ticked off for today', 'Rest up — see you tomorrow.', '', true);
}

// ---------- Habits ----------
/** Habit row: check = full habit (or upgrade a small win); "Small win" logs a smaller level. */
function habitRow(state, a, date, checkAction, openAction, over = '') {
  const h = habitById(a.id);
  const val = state.habits.log[date]?.[a.id];
  const levels = habitLevels(a.id);
  const idx = levelIndex(a.id, val);
  const full = idx === levels.length - 1;
  const partial = idx >= 0 && !full;
  const st = streak(state.habits.log, a.id, date);
  const sub = partial ? `<span style="color:var(--accent);font-weight:650">Small win · ${esc(levels[idx].label)}</span>` : esc(a.cue);
  return `<li class="k-habit ${full ? 'is-done' : ''}"><div class="lrow ${full ? 'done' : ''}">
      <button class="check ${full ? 'on' : partial ? 'partial' : ''}" data-action="${checkAction}" data-id="${a.id}" aria-pressed="${full}" aria-label="${partial ? 'Upgrade to full: ' : ''}${esc(h.title)}">${icon('check')}</button>
      <button class="body row-btn" data-action="${openAction}" data-id="${a.id}">${over ? `<div class="over">${esc(over)} · Habit</div>` : ''}<div class="title"><span>${esc(h.title)}</span></div><div class="sub">${sub}</div></button>
      <span class="trail" style="flex-direction:column;align-items:flex-end;gap:4px">${!full && levels.length > 1 ? `<button class="win-chip" data-action="openSmallWin" data-id="${a.id}">${partial ? 'Change' : 'Small win'}</button>` : ''}${st ? `<span class="tag warm">${icon('flame', 'tiny')}${st}</span>` : ''}</span></div></li>`;
}

// ---------- Your day: one timeline, in the order the day happens ----------
function kcalSummary(state, date) {
  if (store.habitsOnly(state)) return '';
  const t = store.targets(state, date);
  const eaten = eatenSoFar(state, date);
  const p = proteinEaten(state, date);
  const fib = fibreEaten(state, date);
  return `<div class="kcal-sum"><div class="row between nowrap"><div><span class="big">${fmtNum(eaten)}</span> <span class="of">/ ${fmtNum(t.kcal)} kcal</span></div><span class="of">${Math.max(0, t.kcal - eaten).toLocaleString()} left</span></div>
      <div class="meter" role="progressbar" aria-label="Calories eaten" aria-valuenow="${eaten}" aria-valuemax="${t.kcal}"><span style="width:${Math.min(100, (eaten / t.kcal) * 100).toFixed(1)}%"></span></div>
      <div class="meter-legend"><span>Protein ${Math.round(p)} / ${t.proteinG} g · Fibre ${Math.round(fib)} / ${Math.round(t.fiberG)} g</span><span>${dayComplete(state, date) ? '✓ Whole day logged' : 'Tick meals as you go'}</span></div></div>`;
}

function weighRow(state, date) {
  const todays = state.weights.find((w) => w.date === date);
  const u = state.profile.units === 'imperial' ? 'imperial' : 'metric';
  const trend = store.trendWeight(state);
  return `<li class="k-weigh ${todays ? 'is-done' : ''}"><div class="lrow ${todays ? 'done' : ''}"><button class="check ${todays ? 'on' : ''}" data-action="openWeigh" aria-label="${todays ? 'Weighed in' : 'Weigh in'}">${icon(todays ? 'check' : 'scale')}</button><button class="body row-btn" data-action="openWeigh"><div class="over">Morning · after the bathroom</div><div class="title">${todays ? `Weighed in · ${fmtWeight(todays.kg, u)}` : 'Weigh in'}</div><div class="sub">Trend ${fmtWeight(trend, u)}${Math.abs(state.profile.startWeightKg - trend) >= 0.1 ? ` · ${fmtDelta(trend - state.profile.startWeightKg, u)} since start` : ''}</div></button><span class="trail" aria-hidden="true">${icon('chevron')}</span></div></li>`;
}

/** Planned movement rows. One you gave a time in the calendar (or evening planning) sits at that time. */
function moveRows(state, date, linked = {}) {
  const { schedule } = store.schedule(state, date);
  const items = schedule[(new Date(date + 'T12:00').getDay() + 6) % 7].items;
  const logged = state.workouts.log[date] || [];
  const doneTag = `<span class="check on" style="animation:none" role="img" aria-label="Done">${icon('check')}</span>`;
  const out = { any: [], timed: [] };
  for (const it of items) {
    const done = itemDone(logged, it);
    const cls = `k-move ${done ? 'is-done' : ''}`;
    const ev = it.kind === 'rest' ? null : linked[itemKey(it)];
    const when = ev ? `${ev.time ? esc(ev.time) : 'Planned'}${ev.place ? ` · ${esc(ev.place)}` : ''} · ` : '';
    let html;
    if (it.kind === 'rest') html = `<li class="k-move"><div class="lrow"><span class="slot-ico">${icon('move')}</span><div class="body"><div class="title">Rest day</div><div class="sub">A relaxed walk still counts</div></div></div></li>`;
    else if (it.kind === 'strength') html = `<li class="${cls}"><a class="lrow ${done ? 'done' : ''}" href="#/move/session/${it.variant}" style="text-decoration:none">${done ? doneTag : `<span class="slot-ico" style="background:var(--accent-soft);color:var(--accent)">${icon('move')}</span>`}<div class="body"><div class="over">${when}Movement · +40 XP</div><div class="title">Strength session ${it.variant}</div><div class="sub">${it.exercises.length} exercises · ~${it.minutes} min</div></div><span class="trail">${done ? '' : `<span class="btn small primary">Start</span>`}</span></a></li>`;
    else if (it.kind === 'activity') html = `<li class="${cls}"><div class="lrow ${done ? 'done' : ''}">${done ? doneTag : `<button class="check" data-action="activityDone" data-id="${esc(it.id)}" aria-label="Done: ${esc(it.name)}">${icon('check')}</button>`}<div class="body"><div class="over">${when}Movement · your activity</div><div class="title">${esc(it.name)}</div><div class="sub">${it.minutes} min</div></div></div></li>`;
    else html = `<li class="${cls}"><div class="lrow ${done ? 'done' : ''}">${done ? doneTag : `<button class="check" data-action="cardioDone" data-mode="${it.mode}" data-min="${it.minutes}" aria-label="Done: ${esc(CARDIO[it.mode].label)}">${icon('check')}</button>`}<div class="body"><div class="over">${when}Movement</div><div class="title">${esc(CARDIO[it.mode].label)}</div><div class="sub">${it.minutes} min · chatty pace</div></div></div></li>`;
    if (ev?.time) out.timed.push({ time: toMin(ev.time), html });
    else out.any.push(html);
  }
  return out;
}

function yourDay(state, date) {
  const hide = store.habitsOnly(state);
  const show = !hide;
  const meals = mealRowList(state, date);
  const active = store.visibleHabits(state);
  // The weigh-daily habit already sits in the morning; don't show the weigh-in twice.
  const plan = planDay(state.profile, { meals, habits: active, weigh: !hide && !active.some((a) => a.id === 'weigh_daily') });
  const byId = Object.fromEntries(active.map((a) => [a.id, a]));
  const mealHtml = Object.fromEntries(meals.map((m) => [m.slot, m.html]));
  const habitHtml = (id, label) => habitRow(state, byId[id], date, 'habitCheck', 'openHabit', label);
  // Your calendar events for the day sit at their time (untimed ones under "Any time").
  const allEvs = eventsOn(state, date);
  const linked = Object.fromEntries(allEvs.filter((e) => e.planKey).map((e) => [e.planKey, e]));
  const dayKeys = new Set(store.schedule(state, date).schedule[(new Date(date + 'T12:00').getDay() + 6) % 7].items.map(itemKey));
  const evs = allEvs.filter((e) => !e.planKey || !dayKeys.has(e.planKey)); // linked ones show as the session itself
  const moves = moveRows(state, date, linked);
  for (const m of moves.timed) plan.timed.push({ kind: 'movehtml', time: m.time, html: m.html, order: 1.6 });
  const evRow = (e) => `<li class="k-event"><button class="lrow" data-action="calEdit" data-id="${esc(e.series || e.id)}" data-date="${e.date}"><span class="slot-ico" style="font-size:1.15rem">${(EVENT_KINDS[e.kind] || EVENT_KINDS.other).emoji}</span><span class="body"><span class="over">${e.time ? esc(e.time) : 'Any time'} · Calendar${e.public ? ' · open to friends' : ''}</span><span class="title">${esc(e.title)}</span>${e.place ? `<span class="sub">${esc(e.place)}</span>` : ''}</span><span class="trail">${icon('chevron')}</span></button></li>`;
  for (const e of evs) if (e.time) plan.timed.push({ kind: 'event', time: toMin(e.time), ev: e, order: 1.5 });
  // Food you added off the plan sits where you ate it (older entries without a time: under "Any time").
  const extras = state.extras[date] || [];
  const extraRow = (x, i) => `<li class="k-extra is-done"><div class="lrow"><span class="slot-ico" style="background:color-mix(in srgb, var(--ring-eat) 14%, transparent);color:var(--ring-eat-text)">${icon('check')}</span><div class="body">${x.at ? `<div class="over">${esc(x.at)} · You added</div>` : ''}<div class="title"><span>${esc(x.label || 'Extra')}</span></div>${show ? `<div class="sub">${fmtNum(x.kcal)} kcal${x.p ? ` · ${x.p} g protein` : ''}</div>` : ''}</div><button class="icon-btn" data-action="rmExtra" data-i="${i}" aria-label="Remove ${esc(x.label || 'extra')}">${icon('x')}</button></div></li>`;
  extras.forEach((x, i) => x.at && plan.timed.push({ kind: 'extra', time: toMin(x.at), html: extraRow(x, i), order: 2.5 }));
  plan.timed.sort((a, b) => a.time - b.time || a.order - b.order);
  const itemHtml = (it) => (it.kind === 'meal' ? mealHtml[it.slot] : it.kind === 'habit' ? habitHtml(it.id, it.label) : it.kind === 'event' ? evRow(it.ev) : it.kind === 'movehtml' || it.kind === 'extra' ? it.html : weighRow(state, date));
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const parts = [];
  let part = null;
  let nowShown = false;
  const nowLine = `<li class="tl-now" aria-label="Now"><span>Now · ${toHHMM(nowMin)}</span></li>`;
  for (const it of plan.timed) {
    if (!nowShown && date === store.today() && it.time > nowMin) {
      parts.push(nowLine);
      nowShown = true;
    }
    const p = partOf(it.time);
    if (p !== part) {
      part = p;
      parts.push(`<li class="tl-part" aria-hidden="true">${PARTS.find((x) => x.id === p).label}</li>`);
    }
    parts.push(itemHtml(it));
  }
  if (!nowShown && date === store.today()) parts.push(nowLine);
  const extraRows = extras.map((x, i) => (x.at ? '' : extraRow(x, i))).join('');
  const any = [moves.any.join(''), ...evs.filter((e) => !e.time).map(evRow), ...plan.anytime.map((it) => habitHtml(it.id, 'Any time')), extraRows].join('');
  const total = plan.timed.filter((t) => t.kind !== 'extra').length + plan.anytime.length;
  const doneCount = meals.filter((m) => m.done).length + active.filter((a) => state.habits.log[date]?.[a.id]).length + (!hide && state.weights.some((w) => w.date === date) ? 1 : 0);
  const noHabit = active.length ? '' : `<li class="tl-empty"><a class="lrow" href="#/habits" style="text-decoration:none"><span class="slot-ico" style="background:var(--accent-soft);color:var(--accent)">${icon('habits')}</span><span class="body"><span class="title">Pick one small habit</span><span class="sub">It slots into your day at the moment you choose</span></span><span class="trail">${icon('chevron')}</span></a></li>`;
  return `<div class="section-head"><h2>Your day</h2><span class="day-count">${doneCount} of ${total} done</span></div>
    <div class="card tight day-card">${kcalSummary(state, date)}
      <ul class="rows timeline-list">${parts.join('')}${noHabit}
        <li class="tl-part" aria-hidden="true">Any time today</li>${any}
        <li><button class="lrow" data-action="openExtra" style="min-height:54px"><span class="slot-ico" style="background:var(--accent-tint);color:var(--accent)">${icon('plus')}</span><span class="body"><span class="title" style="color:var(--accent)">Add something else you ate</span></span></button></li>
      </ul>
      <div class="day-links"><a href="#/calendar">Calendar</a><a href="#/meals">Week meal plan</a><a href="#/habits">Manage habits</a><a href="#/move">This week’s movement</a></div>
    </div>`;
}

function firstWeek(state, date) {
  if (state.flags?.firstWeekDone || store.weeksSinceStart(state, date) > 0 || state.profile.demo) return '';
  const hide = store.habitsOnly(state);
  const steps = [
    hide ? null : ['Weigh in each morning', state.weights.length >= 4],
    ['Tick off what you eat', Object.values(state.mealLog || {}).some((d) => Object.keys(d).length)],
    ['Do one easy strength session', Object.values(state.workouts.log || {}).some((l) => l.some((x) => x.kind === 'strength'))],
    ['Make one habit’s cue specific', state.habits.active.some((a) => a.cue !== habitById(a.id)?.cue)],
    ['Do your first check-in in 7 days', false],
  ].filter(Boolean);
  const done = steps.filter((s) => s[1]).length;
  return `<details class="card" style="padding:14px 16px"><summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px"><span class="slot-ico" style="background:var(--accent-soft);color:var(--accent)">${icon('star')}</span><span class="grow"><strong>Your first week</strong><span class="sub" style="display:block;font-size:var(--text-sm);color:var(--ink-3)">${done} of ${steps.length} done · small and consistent beats perfect</span></span>${icon('chevron')}</summary>
    <ul class="rows" style="margin-top:8px">${steps.map(([t, ok]) => `<li class="row nowrap" style="padding:8px 0;gap:10px"><span class="check ${ok ? 'on' : ''}" style="width:26px;height:26px" aria-hidden="true">${icon('check')}</span><span>${t}</span></li>`).join('')}</ul>
    <button class="btn small ghost" data-action="dismissFirstWeek" style="margin-top:6px">Hide this</button></details>`;
}

// ---------- Welcome back: the moment people usually quit, met with kindness ----------
function lastActive(state) {
  let last = '';
  const keys = (o) => Object.keys(o || {}).filter((d) => Object.keys(o[d] || {}).length || (Array.isArray(o[d]) && o[d].length));
  for (const d of [...keys(state.mealLog), ...keys(state.habits?.log), ...keys(state.workouts?.log), ...(state.weights || []).map((w) => w.date)]) if (d > last) last = d;
  return last || null;
}

function welcomeBack(state, date) {
  const last = lastActive(state);
  if (!last || last >= date || state.flags?.welcomeBack === date) return '';
  const gap = daysBetween(last, date);
  if (gap < 3) return '';
  return `<section class="welcome-back" aria-label="Welcome back">
    <div class="wb-emoji" aria-hidden="true">🌱</div>
    <h2>Welcome back</h2>
    <p>${gap} days away doesn’t undo anything. In habit research, missing the odd day didn’t stop habits forming — what matters is picking it up again. Today is a fresh start.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="freshStart">Start fresh today</button><a class="btn ghost" href="#/learn/self_compassion">Why slips don’t count</a></div>
  </section>`;
}

function banners(state, date) {
  const out = [safetyNotices(state)];
  if (state.profile.demo) out.push(`<div class="notice info" style="align-items:center;padding:8px 8px 8px 14px">${icon('info')}<div class="grow">Exploring demo data</div><button class="btn small" data-action="endDemo">Start my own</button></div>`);
  const last = state.checkins.length ? state.checkins[state.checkins.length - 1].date : state.profile.startDate;
  const overdue = daysBetween(last, date) >= 9;
