name: Test & build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the commit count is the Android versionCode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy 'tools' package, which current sdkmanager no longer has.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build web bundle and sync Android project
        run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk habit-lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: habit-lab-apk
          path: habit-lab.apk
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Habit Lab (latest build)
          prerelease: false
          make_latest: true
          body: |
            Latest Android build of Habit Lab from `main` (${{ github.sha }}).
            Download `habit-lab.apk` on your phone and open it to install (allow installs from your browser when asked).
            Updates install over the previous version and keep your data.
          files: habit-lab.apk
